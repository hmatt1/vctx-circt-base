name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Verify free-threaded runtime
        run: |
          python -c "import sys; assert hasattr(sys, '_is_gil_enabled'); assert not sys._is_gil_enabled(); print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src tests

      - name: Unit tests (no CIRCT)
        run: python -m pytest -m "not integration"
