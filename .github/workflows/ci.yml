name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:

  circt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      CIRCT_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-circt-base:main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve CIRCT base image
        run: |
          if docker pull "$CIRCT_BASE_IMAGE"; then
            echo "Using published image: $CIRCT_BASE_IMAGE"
            echo "RESOLVED_CIRCT_IMAGE=$CIRCT_BASE_IMAGE" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Published image unavailable ($CIRCT_BASE_IMAGE)."
          echo "Building local fallback image for this run..."
          docker build -f docker/base/Dockerfile -t "circt-fallback:${GITHUB_SHA}" .
          echo "RESOLVED_CIRCT_IMAGE=circt-fallback:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: CIRCT integration checks
        run: |
          docker run --rm \
            -e PYTHON_GIL=0 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$RESOLVED_CIRCT_IMAGE" \
            bash -lc '
              set -euo pipefail
              python3.14t -m pip install --upgrade pip
              bash ./scripts/run_circt_integration.sh python3.14t
            '
