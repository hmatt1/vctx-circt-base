name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src tests

      - name: Unit tests (no CIRCT)
        run: python -m pytest -m "not integration"

  integration-circt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang git curl \
            libbz2-dev libffi-dev libgdbm-dev liblzma-dev libncursesw5-dev \
            libreadline-dev libsqlite3-dev libssl-dev tk-dev uuid-dev xz-utils zlib1g-dev

      - name: Clone CIRCT
        run: |
          git clone --depth 1 https://github.com/llvm/circt.git /tmp/circt
          git -C /tmp/circt submodule update --init --recursive

      - name: Install CIRCT Python bindings
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install /tmp/circt/lib/Bindings/Python

      - name: Install project
        run: python -m pip install -e .[dev]

      - name: Integration tests
        run: python -m pytest -m integration
