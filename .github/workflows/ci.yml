name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Verify free-threaded runtime (3.14t + GIL off)
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          print(sys.version)
          print("Py_GIL_DISABLED=", sysconfig.get_config_var("Py_GIL_DISABLED"))
          print("gil_enabled=", sys._is_gil_enabled())
          assert sys.version_info[:2] == (3, 14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert hasattr(sys, "_is_gil_enabled")
          assert not sys._is_gil_enabled()
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src tests

      - name: Unit tests (no CIRCT)
        run: python -m pytest -m "not integration"

  circt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    env:
      CIRCT_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-circt-base:main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve CIRCT base image
        run: |
          for attempt in $(seq 1 10); do
            if docker pull "$CIRCT_BASE_IMAGE"; then
              echo "RESOLVED_CIRCT_IMAGE=$CIRCT_BASE_IMAGE" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Image not available yet ($attempt/10): $CIRCT_BASE_IMAGE"
            echo "Retrying in 60 seconds..."
            sleep 60
          done

          echo "CIRCT base image still unavailable after retries."
          echo "Building local fallback image for this run..."
          docker build -f docker/base/Dockerfile -t "circt-fallback:${GITHUB_SHA}" .
          echo "RESOLVED_CIRCT_IMAGE=circt-fallback:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: CIRCT integration checks
        run: |
          docker run --rm \
            -e PYTHON_GIL=0 \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$RESOLVED_CIRCT_IMAGE" \
            bash -lc '
              python3.14t -m pip install --upgrade pip
              python3.14t -m pip install -e .[dev]
              bash ./scripts/run_circt_integration.sh python3.14t
            '
