name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

env:
  CIRCT_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-circt-base:main

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Verify free-threaded runtime (3.14t + GIL off)
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          print(sys.version)
          print("Py_GIL_DISABLED=", sysconfig.get_config_var("Py_GIL_DISABLED"))
          print("gil_enabled=", sys._is_gil_enabled())
          assert sys.version_info[:2] == (3, 14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert hasattr(sys, "_is_gil_enabled")
          assert not sys._is_gil_enabled()
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src tests

      - name: Unit tests (no CIRCT)
        run: python -m pytest -m "not integration"

  circt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ env.CIRCT_BASE_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3.14t -m pip install --upgrade pip
          python3.14t -m pip install -e .[dev]

      - name: CIRCT integration checks
        run: bash ./scripts/run_circt_integration.sh python3.14t
